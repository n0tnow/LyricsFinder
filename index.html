<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Finder - Find Song Lyrics</title>
    <meta name="description" content="Easily find and read lyrics for your favorite songs">
    <meta name="application-name" content="Lyrics Finder">
    <meta name="keywords" content="lyrics, music, songs">
    <meta name="author" content="Lyrics Finder App">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Lyrics Finder - Find Song Lyrics">
    <meta property="og:description" content="Easily find and read lyrics for your favorite songs">
    <meta property="og:type" content="website">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Animated background -->
    <div id="twinkling-stars" class="twinkling"></div>
    
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-container">
                <div class="header-content">
                    <div class="header-icon pulse-animation">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" class="icon">
                            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                        </svg>
                    </div>
                    
                    <h1 class="header-title">LYRICS FINDER
                        <span class="sparkle-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" class="icon">
                                <path d="M12 3v3m0 4.5V12m0 4.5V18m-5.4-12L9 9M10.5 10.5 12 12m4.5 4.5L18 18M6 12h3m6 0h3M9 15l2.4-2.4M15 9l-2.4 2.4"></path>
                            </svg>
                        </span>
                    </h1>
                    
                    <div class="header-icon float-animation">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" class="icon">
                            <path d="M9 18V5l12-2v13"></path>
                            <circle cx="6" cy="18" r="3"></circle>
                            <circle cx="18" cy="16" r="3"></circle>
                        </svg>
                    </div>
                </div>
            </div>
        </header>
        
        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <!-- Search Form -->
                <div id="search-form-container" class="card search-form-card">
                    <h2 class="search-form-title">FIND LYRICS</h2>
                    <form id="search-form" class="search-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <input type="text" id="artist-input" class="form-control" placeholder="Artist Name" required>
                                <label for="artist-input" class="form-label">Artist Name</label>
                            </div>
                            
                            <div class="form-group">
                                <input type="text" id="song-input" class="form-control" placeholder="Song Title" required>
                                <label for="song-input" class="form-label">Song Title</label>
                            </div>
                            
                            <button type="submit" id="search-button" class="btn btn-primary search-button">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <span>Search</span>
                            </button>
                        </div>
                    </form>
                </div>
                
                <!-- Current Search Banner (hidden by default) -->
                <div id="current-search-banner" class="current-search-banner" style="display: none;">
                    <p class="banner-label">Current search:</p>
                    <p id="current-search-text" class="banner-text">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon">
                            <path d="M15 4.5l-4 4l-4-4"></path>
                            <path d="M14.5 12.5l.5.5H18l.5-.5v-2l-.5-.5H15"></path>
                            <path d="M5.5 15.5l-.5.5v2l.5.5H9"></path>
                            <path d="M15 19.5l-4-4l-4 4"></path>
                        </svg>
                        <span id="current-search-artist-title"></span>
                    </p>
                </div>
                
                <!-- Search Results (hidden by default) -->
                <div id="search-results-container" class="card results-card" style="display: none;">
                    <div class="results-header">
                        <h3 class="results-title">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon">
                                <path d="M9 18V5l12-2v13"></path>
                                <circle cx="6" cy="18" r="3"></circle>
                                <circle cx="18" cy="16" r="3"></circle>
                            </svg>
                            Search Results
                        </h3>
                        <button id="new-search-button" class="btn btn-small">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon">
                                <line x1="19" y1="12" x2="5" y2="12"></line>
                                <polyline points="12 19 5 12 12 5"></polyline>
                            </svg>
                            New Search
                        </button>
                    </div>
                    
                    <ul id="results-list" class="results-list">
                        <!-- Results will be inserted here by JavaScript -->
                    </ul>
                </div>
                
                <!-- Lyrics View (hidden by default) -->
                <div id="lyrics-container" class="card lyrics-card" style="display: none;">
                    <div class="back-button-container">
                        <button id="back-button" class="back-button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon">
                                <line x1="19" y1="12" x2="5" y2="12"></line>
                                <polyline points="12 19 5 12 12 5"></polyline>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="song-header">
                        <div class="song-avatar">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" class="icon">
                                <path d="M9 18V5l12-2v13"></path>
                                <circle cx="6" cy="18" r="3"></circle>
                                <circle cx="18" cy="16" r="3"></circle>
                            </svg>
                        </div>
                        <div class="song-info">
                            <h2 id="song-title" class="song-title">Song Title</h2>
                            <h3 id="song-artist" class="song-artist">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" class="icon">
                                    <path d="M9 18V5l12-2v13"></path>
                                    <circle cx="6" cy="18" r="3"></circle>
                                    <circle cx="18" cy="16" r="3"></circle>
                                </svg>
                                Artist Name
                            </h3>
                        </div>
                        <div class="song-actions">
                            <button class="download-button" id="download-lyrics-button">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" class="icon">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                Download
                            </button>
                        </div>
                    </div>
                    
                    <div class="lyrics-content">
                        <h3 class="lyrics-title">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon">
                                <path d="M9 18V5l12-2v13"></path>
                                <circle cx="6" cy="18" r="3"></circle>
                                <circle cx="18" cy="16" r="3"></circle>
                            </svg>
                            Lyrics
                        </h3>
                        
                        <div id="lyrics-loading" class="lyrics-loading">
                            <div class="spinner"></div>
                            <p>Loading lyrics...</p>
                        </div>
                        
                        <div id="lyrics-not-found" class="lyrics-not-found" style="display: none;">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>
                                <line x1="12" y1="16" x2="12.01" y2="16"></line>
                            </svg>
                            <h3>Lyrics not found</h3>
                            <p id="not-found-message">The lyrics for this song are not available in our database. You can try searching for another song.</p>
                            <button id="back-to-search-button" class="btn btn-outlined">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon">
                                    <line x1="19" y1="12" x2="5" y2="12"></line>
                                    <polyline points="12 19 5 12 12 5"></polyline>
                                </svg>
                                Back to Search
                            </button>
                        </div>
                        
                        <div id="lyrics-text" class="lyrics-text">
                            <!-- Lyrics will be inserted here by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="app-footer">
            <p>Lyrics Finder - Powered by Lyrics.ovh API</p>
        </footer>
        
        <!-- Snackbar for notifications -->
        <div id="snackbar" class="snackbar">
            <div class="snackbar-content">
                <span id="snackbar-message">Message goes here</span>
                <button id="snackbar-close" class="snackbar-close">×</button>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="lyricsService.js"></script>
    <script src="script.js"></script>
</body>
</html>
